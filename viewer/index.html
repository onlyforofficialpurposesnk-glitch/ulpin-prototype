<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D ULPIN Vertical Property & Cadastral Viewer</title>
  
  <!-- CesiumJS CSS & JS via CDN (No paid account required) -->
  <link href="https://cesium.com/downloads/cesiumjs/releases/1.119/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.119/Build/Cesium/Cesium.js"></script>
  
  <!-- Proj4js for UTM/WGS84 reprojection fallback -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.2/proj4.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    html, body, #cesiumContainer {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0b0f19;
      color: #f1f5f9;
    }

    /* Top Navigation / Controls Bar */
    #topBar {
      position: absolute;
      top: 16px;
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 10px 20px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      z-index: 99;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.36);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand-title {
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #38bdf8;
    }
    .badge {
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      padding: 2px 8px;
      border-radius: 9999px;
      background: rgba(56, 189, 248, 0.2);
      color: #7dd3fc;
      border: 1px solid rgba(56, 189, 248, 0.3);
    }
    .controls-group {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .control-label {
      font-size: 0.82rem;
      color: #94a3b8;
      font-weight: 500;
    }
    select, button {
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    select:hover, button:hover {
      background: #334155;
      border-color: #38bdf8;
    }
    button.btn-primary {
      background: #0284c7;
      color: #ffffff;
      border-color: #38bdf8;
      font-weight: 600;
    }
    button.btn-primary:hover {
      background: #0369a1;
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* Floating Legend */
    #legendCard {
      position: absolute;
      bottom: 24px;
      left: 16px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      padding: 14px 18px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      z-index: 99;
      font-size: 0.82rem;
      max-width: 260px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }
    #legendCard h4 {
      font-size: 0.85rem;
      margin-bottom: 8px;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 6px;
    }
    .legend-swatch {
      width: 14px;
      height: 14px;
      border-radius: 3px;
      flex-shrink: 0;
    }

    /* Discrepancy Banner */
    #discrepancyBanner {
      position: absolute;
      top: 80px;
      right: 16px;
      background: rgba(225, 29, 72, 0.9);
      backdrop-filter: blur(8px);
      color: white;
      padding: 10px 16px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      z-index: 99;
      display: none;
      align-items: center;
      gap: 12px;
      box-shadow: 0 4px 16px rgba(225, 29, 72, 0.4);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.02); }
    }

    /* Modal / Details Drawer */
    #unitModal {
      position: absolute;
      top: 80px;
      left: 16px;
      width: 340px;
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 20px;
      z-index: 100;
      display: none;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 10px;
      margin-bottom: 14px;
    }
    .modal-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: #38bdf8;
    }
    .close-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 1.2rem;
      cursor: pointer;
      line-height: 1;
      padding: 2px 6px;
    }
    .close-btn:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.1);
    }
    .detail-row {
      margin-bottom: 10px;
      font-size: 0.82rem;
    }
    .detail-label {
      color: #94a3b8;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      margin-bottom: 2px;
    }
    .detail-value {
      font-weight: 500;
      word-break: break-all;
      color: #f8fafc;
    }
    .ulpin-tag {
      font-family: monospace;
      font-size: 0.85rem;
      background: #1e293b;
      padding: 4px 6px;
      border-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #38bdf8;
    }
    #loadingIndicator {
      position: absolute;
      bottom: 24px;
      right: 16px;
      background: rgba(15, 23, 42, 0.8);
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 0.8rem;
      color: #94a3b8;
      z-index: 99;
      display: none;
    }
  </style>
</head>
<body>
  <!-- 3D Globe Container -->
  <div id="cesiumContainer"></div>

  <!-- Top Navigation & Controls Bar -->
  <div id="topBar">
    <div class="brand">
      <span class="brand-title">3D ULPIN Vertical Property</span>
      <span class="badge">LADM 3D</span>
    </div>
    <div class="controls-group">
      <span class="control-label">Floor Filter:</span>
      <select id="levelSelect">
        <option value="all">All Levels</option>
      </select>
      <button id="btnRunAsBuilt" class="btn-primary">Run as-built check</button>
      <button id="btnResetCamera">Reset View</button>
    </div>
  </div>

  <!-- Discrepancy Notification Banner -->
  <div id="discrepancyBanner">
    <span id="discrepancyIcon">⚠️</span>
    <span id="discrepancyText">Discrepancy detected: Extra storey flagged</span>
  </div>

  <!-- Floating Legend -->
  <div id="legendCard">
    <h4>Ownership & Status</h4>
    <div id="legendItems">
      <!-- Injected by app.js -->
    </div>
  </div>

  <!-- Property Details Modal / Panel -->
  <div id="unitModal">
    <div class="modal-header">
      <div class="modal-title">Property Unit Details</div>
      <button id="btnCloseModal" class="close-btn">&times;</button>
    </div>
    <div id="modalContent">
      <!-- Injected by app.js -->
    </div>
  </div>

  <!-- Loading status pill -->
  <div id="loadingIndicator">Loading spatial units...</div>

  <!-- Main Viewer Application Logic -->
  <script src="app.js"></script>
</body>
</html>
